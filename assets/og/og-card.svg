  <!-- Palette copied from the site dark theme: surface #0d3b3f, accent #ff7262 -->
  <defs>
    <style>
      .heading { font-family: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0d3b3f"/>

  <!-- Subtle grid, kept low contrast so text stays dominant -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 105.5H1200M0 210.5H1200M0 315.5H1200M0 420.5H1200M0 525.5H1200"/>
    <path d="M120.5 0V630M240.5 0V630M360.5 0V630M480.5 0V630M600.5 0V630M720.5 0V630M840.5 0V630M960.5 0V630M1080.5 0V630"/>
